generated: '2026-07-19'
method: searched
source: >-
  https://github.com/libryo/libryo-api-oauth-docs, live endpoint probing on 2026-07-19,
  https://libryo.com/privacy-policy/, https://libryo.com/faqs/, and the well-known probe in
  well-known/libryo-well-known.yml.
description: >-
  Cross-cutting standards conformance for the Libryo partner API, asserted only where there
  is evidence. Libryo publishes no OpenAPI definition and no security or trust page, so
  several standards are recorded as unknown rather than false — absence of published
  evidence is not evidence of non-conformance, and that distinction is preserved here.
standards:
- id: oauth2
  conforms: true
  evidence: >-
    Libryo documents the OAuth 2.0 authorization-code grant with authorize and token
    endpoints, client_id/client_secret, redirect_uri and space-delimited scopes
    (github.com/libryo/libryo-api-oauth-docs). The live token endpoint returns RFC 6749
    §5.2 error responses.
- id: rfc6749-error-response
  conforms: true
  evidence: >-
    POST https://api.libryo.com/api/v1/oauth/token returned
    {"error":"invalid_request","error_description":"...","hint":"..."} with HTTP 400 —
    the RFC 6749 error shape, plus a non-standard "hint" extension.
- id: bearer-token-auth
  conforms: true
  evidence: >-
    Access tokens are issued by an OAuth 2.0 token endpoint for use against the /api/v1
    surface.
- id: oidc
  conforms: false
  evidence: >-
    No /.well-known/openid-configuration on libryo.com, my.libryo.com or api.libryo.com
    (all 404). Libryo is an OAuth 2.0 authorization surface for delegated API access, not
    an OpenID Connect identity provider.
- id: rfc8414-authorization-server-metadata
  conforms: false
  evidence: >-
    No /.well-known/oauth-authorization-server document on any host (404). OAuth endpoints
    must be configured manually from the written guide.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors are returned as RFC 6749 OAuth error objects with application/json, not
    application/problem+json. See errors/libryo-problem-types.yml.
- id: rfc9116-security-txt
  conforms: false
  evidence: No /.well-known/security.txt on any Libryo host (404).
- id: pkce
  conforms: unknown
  evidence: >-
    The public guide documents neither code_challenge nor code_challenge_method. Libryo may
    support PKCE for partner clients without documenting it publicly.
- id: idempotency
  conforms: unknown
  evidence: >-
    No idempotency-key mechanism is documented. The published scope surface is read-only,
    so there is no documented unsafe write requiring it.
- id: pagination
  conforms: unknown
  evidence: >-
    Collection-returning capabilities exist (list-libryos, search-legislation) but no
    pagination parameters or envelope are published.
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger definition is published at any probed path on api.libryo.com, nor
    in the public GitHub organization. The FAQ states the platform has "a full documented
    RESTful API"; that reference documentation is not public.
- id: akoma-ntoso
  conforms: true
  evidence: >-
    Libryo authors and open-sources nkyimu, a TypeScript library for creating
    self-validating Akoma Ntoso (OASIS LegalDocML) documents, published to npm under the
    company's own devops@libryo.com account. This is a genuine domain-standard adoption on
    the legislation-data side of the platform.
- id: gdpr
  conforms: true
  evidence: >-
    Libryo's privacy policy operates under ERM's data protection program, naming
    dataprivacy@erm.com and an external Data Protection Officer (Bird & Bird DPO Services
    SRL, Brussels), with documented EEA transfer safeguards.
- id: soc2
  conforms: unknown
  evidence: >-
    No trust center or certification page found; no SOC 2 claim published on libryo.com.
- id: iso27001
  conforms: unknown
  evidence: >-
    No ISO 27001 claim found on libryo.com or in the privacy policy. Any certification held
    at ERM group level is not surfaced on the Libryo product site.
compliance_note: >-
  Because no named security certification is published on Libryo's own public surface, this
  repo intentionally emits NO `Compliance` pointer in apis.yml. GDPR program detail alone is
  not a published certification.

notes: >-
  Libryo runs OAuth 2.0 but publishes no RFC 8414 authorization-server metadata document,
  so the endpoints must be configured from its written guide rather than discovered.
  Important caveat for anyone re-probing- *.libryo.com is a wildcard DNS record pointing at
  the platform load balancer (libryo-lb-338296508.eu-west-1.elb.amazonaws.com), so ANY
  hostname under libryo.com answers HTTP 200 with the application login page. Hosts such as
  developer.libryo.com and docs.libryo.com therefore look alive but are not real developer
  surfaces, and a naive probe will report false positives.

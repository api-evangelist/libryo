apis:
- aid: libryo:libryo-api
  name: Libryo API
  description: >-
    The Libryo Platform's partner-facing RESTful API. Third-party applications integrate
    on behalf of a Libryo user using the OAuth 2.0 authorization-code flow, then call the
    versioned /api/v1 surface to view legal reports, search legislation, and list the
    user's Libryos (site-specific regulatory streams). Libryo publishes the OAuth
    integration guide in a public GitHub repository; the endpoint reference itself is
    made available to partners under agreement rather than published openly.

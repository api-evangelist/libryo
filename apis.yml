aid: libryo
name: Libryo
description: >-
  Libryo (ERM Libryo) is a regulatory compliance management platform for Environmental,
  Health and Safety (EHS) teams. It automates legal registers, streams site-specific
  regulatory obligations across jurisdictions, and tracks legislative change so that
  operators know which laws apply to each of their sites. Founded in 2016 with a
  distributed team across Cape Town, London, Toronto, Nairobi and Berlin, Libryo is now
  part of ERM, the sustainability consultancy. The product surface spans Libryo Sites
  (site-specific EHS regulatory intelligence), Libryo Assess (assessment and audit
  management), Libryo Collaborate, and custom legal registers, and is used in
  manufacturing, energy and utilities, chemicals, mining, logistics and telecoms. Libryo
  exposes a partner-facing RESTful API secured with OAuth 2.0 authorization-code flow,
  documented publicly in the libryo/libryo-api-oauth-docs repository, and also offers its
  regulatory content as a data-as-a-service feed into third-party GRC platforms.
